<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FC-TYPE.3 — Prototype Gõ Pinyin</title>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body>
  <main class="typing-app" id="typingApp">
    <header class="typing-header">
      <button class="icon-button" id="closeButton" type="button" aria-label="Thoát phiên">←</button>
      <div>
        <p class="eyebrow">FLASHCARD · GÕ PINYIN</p>
        <h1>Gõ từng ký tự</h1>
      </div>
      <span class="progress-pill" id="progressText">1 / 4</span>
    </header>

    <section class="mode-panel" aria-label="Kiểu câu hỏi">
      <button class="mode-chip is-active" type="button" data-prompt-mode="hanzi">Chữ Trung → Pinyin</button>
      <button class="mode-chip" type="button" data-prompt-mode="meaning">Nghĩa Việt → Pinyin</button>
    </section>

    <section class="typing-stats" aria-label="Thống kê thẻ hiện tại">
      <div class="typing-stat">
        <span>Thời gian</span>
        <strong id="timeStat">0:00</strong>
      </div>
      <div class="typing-stat">
        <span>Chính xác</span>
        <strong id="accuracyStat">100%</strong>
      </div>
      <div class="typing-stat">
        <span>Lỗi</span>
        <strong id="errorStat">0</strong>
      </div>
    </section>

    <section class="typing-card" id="typingCard">
      <p class="prompt-type" id="promptType">Chữ Trung → Pinyin</p>
      <div class="prompt-content" id="promptContent">学习</div>
      <div class="card-tools" aria-label="Công cụ hỗ trợ">
        <button class="speaker-button" id="speakerButton" type="button" aria-label="Nghe phát âm tiếng Trung">🔊 Nghe</button>
        <button class="knowledge-button" id="knowledgeButton" type="button" aria-expanded="false" aria-controls="answerReveal">
          <span aria-hidden="true">💡</span>
          <span>Đáp án</span>
        </button>
      </div>

      <div class="answer-reveal" id="answerReveal" hidden>
        <div class="answer-reveal__head">
          <span>Đáp án đúng</span>
          <button class="answer-reveal__close" id="closeAnswerButton" type="button" aria-label="Ẩn đáp án">×</button>
        </div>
        <strong id="revealedPinyin"></strong>
        <p id="revealedContext"></p>
      </div>

      <div class="slots-shell" id="slotsShell" tabindex="0" role="group" aria-label="Nhập pinyin từng ký tự">
        <div class="typing-slots" id="typingSlots" aria-live="polite"></div>
        <input
          id="typingInput"
          class="typing-native-input"
          type="text"
          inputmode="text"
          enterkeyhint="next"
          autocapitalize="none"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="Nhập pinyin"
        >
      </div>

      <p class="typing-status sr-only" id="typingStatus" role="status" aria-live="polite"></p>
      <div class="hint-box" id="hintBox" hidden>
        <span class="hint-icon" aria-hidden="true">💡</span>
        <span id="hintText"></span>
      </div>

    </section>

    <section class="result-panel" id="resultPanel" hidden aria-live="polite">
      <div class="result-check">✓</div>
      <div>
        <strong>Chính xác</strong>
        <p id="resultDetails"></p>
      </div>
    </section>

    <section class="debug-panel" aria-label="Công cụ thử prototype">
      <button id="resetCardButton" type="button">Làm lại thẻ</button>
      <button id="nextCardButton" type="button">Thẻ tiếp theo</button>
    </section>
  </main>

  <script src="../../pinyin-typing-engine.js"></script>
  <script src="../../pinyin-typing-state-machine.js"></script>
  <script src="./prototype.js"></script>
</body>
</html>
